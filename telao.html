<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telão da apuração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --papel:#050907; --tinta:#E8F3EC; --apagado:#93AA9D; --linha:#1F3328; --cartao:#0D1511;
  --neon:#39FF14; --lula:#FF2B3A; --flavio:#2E6BFF; --vazio:#15201A; --alerta:#FFB020;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--papel);background-image:radial-gradient(1000px 500px at 70% -10%,rgba(57,255,20,.08),transparent 60%);
  color:var(--tinta);font:400 18px/1.4 "Barlow",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.topo{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(57,255,20,.25);flex-wrap:wrap}
.topo h1{font:700 1.7rem/1 "Barlow Condensed",system-ui,sans-serif;margin:0;color:var(--neon);text-shadow:0 0 14px rgba(57,255,20,.55)}
.topo .sub{color:var(--apagado);font-size:.95rem}
.topo .esp{flex:1}
.topo a,.topo button{color:var(--tinta);background:transparent;border:1px solid rgba(57,255,20,.35);border-radius:6px;padding:8px 12px;min-height:44px;font:inherit;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.topo a:focus-visible,.topo button:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
.relogio{font-size:1.9rem;color:var(--tinta)}
.palco{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:18px 20px 24px}
@media (min-width:1000px){.palco{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center}}
.placar{display:grid;gap:14px}
.cand{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:4px 16px;padding:16px 18px;border-radius:12px;border:1px solid var(--linha);background:var(--cartao)}
.cand .nome{font:700 1.5rem/1 "Barlow Condensed",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.cand .pct{font-size:clamp(3.6rem,10vw,7.5rem);line-height:.9;font-weight:700;grid-row:1 / span 2}
.cand .votos{color:var(--apagado);font-size:1.15rem}
.cand.l{border-color:rgba(255,43,58,.55)} .cand.l .nome,.cand.l .pct{color:var(--lula)}
.cand.f{border-color:rgba(46,107,255,.6)} .cand.f .nome,.cand.f .pct{color:#5C8DFF}
.cand.lider{box-shadow:0 0 28px rgba(57,255,20,.25);border-color:var(--neon)}
.barra{display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--vazio)}
.barra span{display:block;transition:flex .6s}
.barra .l{background:var(--lula)} .barra .f{background:var(--flavio)}
.apurado{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.apurado b{font-size:2.6rem;line-height:1;color:var(--neon);text-shadow:0 0 12px rgba(57,255,20,.5)}
.proj{padding:14px 18px;border-radius:12px;border:1px solid var(--linha);background:var(--cartao)}
.proj b.def{color:var(--neon);text-shadow:0 0 10px rgba(57,255,20,.5)}
.proj small{display:block;color:var(--apagado);margin-top:4px}
.alerta{padding:12px 16px;border-radius:10px;background:rgba(255,176,32,.12);border:1px solid var(--alerta);font-weight:600;animation:pisca 1.2s 6}
@keyframes pisca{50%{background:rgba(255,176,32,.35)}}
@media (prefers-reduced-motion:reduce){.alerta{animation:none}.barra span{transition:none}}
.mapa{display:grid;gap:10px}
.mapa svg{width:100%;height:auto;max-height:74vh;display:block;filter:drop-shadow(0 0 6px rgba(57,255,20,.55))}
.mapa svg path{stroke:#39FF14;stroke-width:1.5;stroke-linejoin:round;transition:fill .6s}
.mapa svg text{font:700 17px "Barlow Condensed",system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
.contagem{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:1.1rem}
.contagem b.l{color:var(--lula)} .contagem b.f{color:#5C8DFF}
.rodape{padding:0 20px 14px;color:var(--apagado);font-size:.85rem}
body.cheia .topo .some-cheia{display:none}
</style>
</head>
<body>
<header class="topo">
  <h1>Apuração 2026</h1>
  <span class="sub" id="turno">Presidente</span>
  <span class="esp"></span>
  <span class="relogio num" id="relogio" aria-label="Hora em Brasília">--:--</span>
  <button type="button" id="cheia">Tela cheia</button>
  <button type="button" id="imagem">Salvar imagem</button>
  <a class="some-cheia" href="index.html">Voltar ao painel</a>
</header>

<main class="palco">
  <section class="placar" aria-live="polite" aria-label="Placar">
    <div id="alerta" class="alerta" hidden></div>
    <div class="cand l" id="c-l"><span class="pct num" id="p-l">–</span><span class="nome">Lula</span><span class="votos num" id="v-l"></span></div>
    <div class="cand f" id="c-f"><span class="pct num" id="p-f">–</span><span class="nome">Flávio Bolsonaro</span><span class="votos num" id="v-f"></span></div>
    <div class="barra" role="img" aria-label="Proporção de votos" id="barra"><span class="l" style="flex:1"></span><span class="f" style="flex:1"></span></div>
    <div class="apurado"><b class="num" id="ap">–</b><span>das seções totalizadas</span></div>
    <div class="proj" id="proj" hidden></div>
  </section>
  <section class="mapa" aria-label="Mapa por estado">
    <svg id="mapa" viewBox="0 0 1000 968" role="img" aria-label="Mapa do Brasil, estados coloridos por quem lidera"></svg>
    <div class="contagem num"><span><b class="l" id="n-l">0</b> estados com Lula</span><span><b class="f" id="n-f">0</b> com Flávio</span></div>
  </section>
</main>
<p class="rodape" id="rodape">Dados oficiais do TSE. Projeção é estimativa, não resultado oficial.</p>

  function valor(x){ var t = String(x === undefined || x === null ? "" : x), n = t.indexOf(",") >= 0 ? parseFloat(t.replace(/\./g, "").replace(",", ".")) : parseFloat(t); return isNaN(n) ? 0 : n; }
  function cands(d){ var o = []; (function a(x){ if (!x || typeof x !== "object") return; if (Array.isArray(x)){ x.forEach(a); return; } if (x.vap !== undefined && x.sqcand !== undefined){ o.push(x); return; } Object.keys(x).forEach(function(k){ a(x[k]); }); })(d); return o; }
  function resumo(d){
    var tot = 0, L = 0, F = 0;
    cands(d).forEach(function(c){ var v = valor(c.vap), n = c.nmu || c.nm; tot += v; if (/lula/i.test(n)) L = v; else if (/fl[aá]vio/i.test(n)) F = v; });
    return { L:L, F:F, tot:tot, pst:valor(d.s && d.s.pst) };
  }
  function url(uf){ return BASE + "/" + CICLO + "/" + ELE + "/dados/" + uf + "/" + uf + "-c0001-e" + ("000000" + ELE).slice(-6) + "-u.json"; }
  function pedir(uf){ return fetch(url(uf), { cache:"no-cache" }).then(function(r){ return r.status === 200 ? r.json() : null; }); }
  function f1(x){ return x.toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 }); }
  function n0(x){ return Math.round(x).toLocaleString("pt-BR"); }

  // mapa
  var g = "";
  UFS.forEach(function(u){ g += '<path id="e-' + u + '" d="' + MAPA.p[u] + '" fill="' + COR.v + '"><title>' + u + '</title></path>'; });
  UFS.forEach(function(u){ var c = MAPA.c[u]; if (c) g += '<text x="' + c[0] + '" y="' + c[1] + '">' + u + '</text>'; });
  $("mapa").innerHTML = g;

  function alerta(msg){ var a = $("alerta"); a.textContent = msg; a.hidden = false; a.style.animation = "none"; void a.offsetWidth; a.style.animation = ""; }

  function pintarPlacar(){
    var r = BR; if (!r || !(r.tot > 0)) { $("p-l").textContent = $("p-f").textContent = "–"; $("ap").textContent = "–"; return; }
    var pl = r.L / r.tot * 100, pf = r.F / r.tot * 100;
    $("p-l").textContent = f1(pl) + "%"; $("p-f").textContent = f1(pf) + "%";
    $("v-l").textContent = n0(r.L) + " votos"; $("v-f").textContent = n0(r.F) + " votos";
    $("barra").innerHTML = '<span class="l" style="flex:' + pl.toFixed(2) + '"></span><span class="f" style="flex:' + pf.toFixed(2) + '"></span>';
    $("ap").textContent = f1(r.pst) + "%";
    $("c-l").classList.toggle("lider", r.L > r.F); $("c-f").classList.toggle("lider", r.F > r.L);
    var lid = r.L >= r.F ? "Lula" : "Flávio";
    if (r.L !== r.F){ if (liderAnt && liderAnt !== lid) alerta("Virada: " + lid + " passou à frente."); liderAnt = lid; }
  }
  function pintarMapa(){
    var nl = 0, nf = 0;
    UFS.forEach(function(u){
      var r = ESTADOS[u], p = $("e-" + u), cor = COR.v;
      if (r && r.tot > 0){ if (r.L > r.F){ cor = COR.l; nl++; } else if (r.F > r.L){ cor = COR.f; nf++; } else cor = COR.o; }
      p.setAttribute("fill", cor);
    });
    $("n-l").textContent = nl; $("n-f").textContent = nf;
  }
  function pintarProj(){
    var el = $("proj"), L = 0, F = 0, Lp = 0, Fp = 0, rest = 0, com = 0;
    UFS.forEach(function(u){ var r = ESTADOS[u]; if (!r || !(r.pst > 0) || !(r.L + r.F > 0)) return; var fr = Math.min(1, r.pst / 100); com++; L += r.L; F += r.F; Lp += r.L / fr; Fp += r.F / fr; rest += (r.L + r.F) * (1 / fr - 1); });
    if (!com || turno !== 2){ el.hidden = true; return; }
    var tot = Lp + Fp, pl = Lp / tot * 100, pf = Fp / tot * 100, margem = Math.abs(L - F), lid = L >= F ? "Lula" : "Flávio", def = com === 27 && margem > rest * 1.25;
    if (def && defAviso !== lid){ defAviso = lid; alerta("Vitória de " + lid + " matematicamente definida (projeção)."); }
    el.hidden = false;
    el.innerHTML = '<b class="' + (def ? "def" : "") + '">' + (def ? "Resultado definido: " + lid + " vence" : "Projeção: " + lid + " na frente, em aberto") + '</b>' +
      '<small>Projeção final: Lula ' + f1(pl) + '% × Flávio ' + f1(pf) + '%. Vantagem atual ' + n0(margem) + ' votos; faltam cerca de ' + n0(rest) + ' votos válidos' + (com < 27 ? " (" + (27 - com) + " estados sem votos)" : "") + '.</small>';
  }
  function hora(){ $("relogio").textContent = new Date().toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit", timeZone:"America/Sao_Paulo" }); }
  hora(); setInterval(hora, 15000);

  function lerBr(){ return pedir("br").then(function(d){ if (d){ BR = resumo(d); ultima = Date.now(); } pintarPlacar(); }).catch(function(){}); }
  var lendoUf = false;
  function lerUfs(){
    if (lendoUf) return Promise.resolve(); lendoUf = true;
    return UFS.reduce(function(p, u){
      return p.then(function(){ return pedir(u.toLowerCase()).then(function(d){ if (d){ ESTADOS[u] = resumo(d); } }).catch(function(){}).then(function(){ return new Promise(function(ok){ setTimeout(ok, 120); }); }); });
    }, Promise.resolve()).then(function(){ lendoUf = false; pintarMapa(); pintarProj(); $("rodape").textContent = "Dados oficiais do TSE, última leitura às " + new Date().toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit", timeZone:"America/Sao_Paulo" }) + ". Projeção é estimativa, não resultado oficial."; });
  }
  lerBr().then(lerUfs);
  setInterval(function(){ if (!document.hidden) lerBr(); }, 30000);
  setInterval(function(){ if (!document.hidden) lerUfs(); }, 90000);

  // tela cheia e tela acesa
  $("cheia").addEventListener("click", function(){
    var d = document.documentElement;
    if (document.fullscreenElement){ document.exitFullscreen(); } else if (d.requestFullscreen){ d.requestFullscreen().catch(function(){}); }
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function(){}); } catch(e){}
  });
  document.addEventListener("fullscreenchange", function(){ document.body.classList.toggle("cheia", !!document.fullscreenElement); $("cheia").textContent = document.fullscreenElement ? "Sair da tela cheia" : "Tela cheia"; });

  // salvar imagem (1280 x 720): placar + mapa
  $("imagem").addEventListener("click", function(){
    var W = 1280, H = 720, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    var c = cv.getContext("2d"), fam = '"Barlow Condensed","Arial Narrow",Arial,sans-serif';
    c.fillStyle = "#050907"; c.fillRect(0, 0, W, H);
    c.fillStyle = "#39FF14"; c.font = "700 40px " + fam; c.fillText("Apuração 2026", 40, 62);
    c.fillStyle = "#93AA9D"; c.font = "500 24px " + fam; c.fillText("Presidente, " + turno + "º turno · " + new Date().toLocaleString("pt-BR", { timeZone:"America/Sao_Paulo", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }), 40, 98);
    var r = BR && BR.tot > 0 ? BR : null, pl = r ? r.L / r.tot * 100 : 0, pf = r ? r.F / r.tot * 100 : 0;
    function bloco(y, nome, cor, p, v){ c.fillStyle = cor; c.font = "700 30px " + fam; c.fillText(nome.toUpperCase(), 40, y); c.font = "700 130px " + fam; c.fillText(r ? f1(p) + "%" : "–", 40, y + 120); c.fillStyle = "#93AA9D"; c.font = "500 26px " + fam; c.fillText(r ? n0(v) + " votos" : "", 40, y + 158); }
    bloco(150, "Lula", "#FF2B3A", pl, r ? r.L : 0); bloco(350, "Flávio Bolsonaro", "#5C8DFF", pf, r ? r.F : 0);
    if (r){ c.fillStyle = "#15201A"; c.fillRect(40, 560, 560, 22); c.fillStyle = "#FF2B3A"; c.fillRect(40, 560, 560 * pl / (pl + pf), 22); c.fillStyle = "#2E6BFF"; c.fillRect(40 + 560 * pl / (pl + pf), 560, 560 * pf / (pl + pf), 22); c.fillStyle = "#39FF14"; c.font = "700 44px " + fam; c.fillText(f1(r.pst) + "% das seções", 40, 640); }
    c.fillStyle = "#93AA9D"; c.font = "500 20px " + fam; c.fillText("Fonte: TSE", 40, 692);
    var svg = $("mapa").cloneNode(true); svg.setAttribute("xmlns", "http://www.w3.org/2000/svg"); svg.setAttribute("width", 640); svg.setAttribute("height", 620);
    [].forEach.call(svg.querySelectorAll("path"), function(p){ p.setAttribute("stroke", "#39FF14"); p.setAttribute("stroke-width", "1.5"); });
    [].forEach.call(svg.querySelectorAll("text"), function(t){ t.setAttribute("fill", "#fff"); t.setAttribute("font-size", "17"); t.setAttribute("font-weight", "700"); t.setAttribute("text-anchor", "middle"); t.setAttribute("dominant-baseline", "middle"); });
    var img = new Image(), blob = new Blob([new XMLSerializer().serializeToString(svg)], { type:"image/svg+xml" }), u = URL.createObjectURL(blob);
    img.onload = function(){
      c.drawImage(img, 620, 60, 640, 620); URL.revokeObjectURL(u);
      cv.toBlob(function(b){
        var f = new File([b], "apuracao-" + turno + "t.png", { type:"image/png" });
        if (navigator.canShare && navigator.canShare({ files:[f] })) navigator.share({ files:[f], title:"Apuração 2026" }).catch(function(){});
        else { var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
      }, "image/png");
    };
    img.onerror = function(){ alert("Não consegui gerar a imagem neste navegador."); };
    img.src = u;
  });
})();
</script>
